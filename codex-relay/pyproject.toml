[project]
name = "bifrost-codex"
version = "0.1.0"
description = "Bifrost — Codex Relay：工业软件中继适配层 Codex 插件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bifrost Maintainers" }
]
keywords = [
    "kicad", "stm32", "pcb", "firmware", "industrial",
    "eda", "embedded", "solidworks", "cad", "automation",
    "codex", "mcp", "agent-skills"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "bifrost>=0.1.0",
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "typer>=0.15.0,<1.0.0",
    "structlog>=24.4.0,<26.0.0",
]

[project.optional-dependencies]
stm32 = ["pyocd>=0.36.0,<1.0.0"]
solidworks = ["pywin32>=308; sys_platform == 'win32'"]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "mypy>=1.13.0,<2.0.0",
    "black>=24.10.0,<26.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codex_plugin*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "hardware: 需要真实硬件（STM32 开发板等）",
    "kicad: 需要 KiCad 安装",
    "slow: 耗时较长的测试",
    "integration: 集成测试",
]
